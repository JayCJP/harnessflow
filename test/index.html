<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>待办清单</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: #f5f6f8;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .app {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 24px;
    }

    .app h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: center;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .input-row input {
      flex: 1;
      height: 40px;
      padding: 0 12px;
      font-size: 15px;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus {
      border-color: #4a90d9;
    }

    .input-row button {
      height: 40px;
      padding: 0 20px;
      font-size: 15px;
      color: #fff;
      background: #4a90d9;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-row button:hover {
      background: #3a7bc0;
    }

    .todo-list {
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 8px;
      border-bottom: 1px solid #f0f0f0;
    }

    .todo-item:last-child {
      border-bottom: none;
    }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-item .todo-text {
      flex: 1;
      font-size: 15px;
      word-break: break-all;
      transition: color 0.2s;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #bbb;
    }

    .todo-item .delete-btn {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #999;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s;
    }

    .todo-item .delete-btn:hover {
      background: #ffecec;
      color: #e55353;
    }

    .empty-tip {
      text-align: center;
      color: #bbb;
      font-size: 14px;
      padding: 24px 0;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tabs .tab {
      flex: 1;
      height: 36px;
      font-size: 14px;
      color: #666;
      background: #f5f6f8;
      border: 1px solid #ececec;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .tabs .tab:hover {
      background: #eef4fb;
    }

    .tabs .tab.active {
      color: #4a90d9;
      background: #eaf3fc;
      border-color: #4a90d9;
      font-weight: 600;
    }

    .tabs .tab .count {
      margin-left: 4px;
      font-size: 12px;
      color: #aaa;
    }

    .tabs .tab.active .count {
      color: #4a90d9;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>待办清单</h1>

    <!-- 输入区：待办输入框 + 添加按钮 -->
    <div class="input-row">
      <input id="todo-input" type="text" placeholder="输入待办事项" aria-label="待办事项输入框" />
      <button id="add-btn" type="button" aria-label="添加待办">添加</button>
    </div>

    <!-- 状态切换 Tab：全部 / 未完成 / 已完成 -->
    <!-- 无障碍语义：容器 role=tablist，每个 tab 按钮 role=tab + aria-controls 指向列表容器，aria-selected 由 render 维护 -->
    <div class="tabs" id="tabs" role="tablist" aria-label="待办状态筛选">
      <button class="tab active" data-filter="all" type="button" role="tab" aria-controls="todo-list" aria-selected="true" aria-label="查看全部待办">全部<span class="count" id="count-all">0</span></button>
      <button class="tab" data-filter="active" type="button" role="tab" aria-controls="todo-list" aria-selected="false" aria-label="查看未完成待办">未完成<span class="count" id="count-active">0</span></button>
      <button class="tab" data-filter="completed" type="button" role="tab" aria-controls="todo-list" aria-selected="false" aria-label="查看已完成待办">已完成<span class="count" id="count-completed">0</span></button>
    </div>

    <!-- 待办列表容器 -->
    <ul id="todo-list" class="todo-list"></ul>
  </div>

  <script>
    /**
     * 待办数据模型：唯一数据源，纯内存数组。
     * 每条待办项结构：{ id: number, text: string, completed: boolean }
     * 不做 localStorage 持久化，刷新页面即清空。
     * @type {Array<{id: number, text: string, completed: boolean}>}
     */
    let todos = [];

    /** 自增 id，用于唯一标识每条待办 */
    let nextId = 1;

    /** 当前 Tab 筛选状态：'all' 全部 / 'active' 未完成 / 'completed' 已完成 */
    let currentFilter = 'all';

    /** 输入框 DOM 引用 */
    const inputEl = document.getElementById('todo-input');
    /** 添加按钮 DOM 引用 */
    const addBtnEl = document.getElementById('add-btn');
    /** 列表容器 DOM 引用 */
    const listEl = document.getElementById('todo-list');
    /** Tab 容器 DOM 引用 */
    const tabsEl = document.getElementById('tabs');

    /**
     * 根据当前 Tab 筛选条件返回需要展示的待办子集。
     * @returns {Array<{id: number, text: string, completed: boolean}>} 筛选后的待办列表
     */
    function getVisibleTodos() {
      if (currentFilter === 'active') {
        return todos.filter(function (t) {
          return !t.completed;
        });
      }
      if (currentFilter === 'completed') {
        return todos.filter(function (t) {
          return t.completed;
        });
      }
      return todos;
    }

    /**
     * 渲染函数：依据当前筛选状态渲染待办列表，并刷新各 Tab 计数与高亮。
     * 当前筛选下无待办时展示对应的空态提示文案。
     * @returns {void}
     */
    function render() {
      listEl.innerHTML = '';

      // 刷新各 Tab 数量徽标
      document.getElementById('count-all').textContent = todos.length;
      document.getElementById('count-active').textContent = todos.filter(function (t) {
        return !t.completed;
      }).length;
      document.getElementById('count-completed').textContent = todos.filter(function (t) {
        return t.completed;
      }).length;

      // 高亮当前激活 Tab，并同步无障碍 aria-selected 状态
      const tabBtns = tabsEl.querySelectorAll('.tab');
      tabBtns.forEach(function (btn) {
        const isActive = btn.dataset.filter === currentFilter;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
      });

      const visible = getVisibleTodos();

      if (visible.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty-tip';
        empty.textContent =
          currentFilter === 'active' ? '没有未完成的待办' :
          currentFilter === 'completed' ? '还没有已完成的待办' : '暂无待办事项';
        listEl.appendChild(empty);
        return;
      }

      visible.forEach((todo) => {
        const item = document.createElement('li');
        item.className = 'todo-item' + (todo.completed ? ' completed' : '');

        // 复选框：切换完成状态
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.completed;
        checkbox.setAttribute('aria-label', '标记完成「' + todo.text + '」');
        checkbox.addEventListener('change', function () {
          toggleTodo(todo.id);
        });

        // 待办文本
        const text = document.createElement('span');
        text.className = 'todo-text';
        text.textContent = todo.text;

        // 删除按钮
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'delete-btn';
        delBtn.textContent = '×';
        delBtn.setAttribute('aria-label', '删除待办「' + todo.text + '」');
        delBtn.addEventListener('click', function () {
          removeTodo(todo.id);
        });

        item.appendChild(checkbox);
        item.appendChild(text);
        item.appendChild(delBtn);
        listEl.appendChild(item);
      });
    }

    /**
     * 切换 Tab 筛选状态：更新 currentFilter 并重新渲染。
     * 对非法筛选值（非 'all'/'active'/'completed'）做防御性兜底，回退为 'all'，
     * 避免 currentFilter 进入非法态导致 getVisibleTodos 语义错乱。
     * @param {string} filter 目标筛选值：'all' / 'active' / 'completed'
     * @returns {void}
     */
    function switchFilter(filter) {
      var VALID_FILTERS = ['all', 'active', 'completed'];
      if (VALID_FILTERS.indexOf(filter) === -1) {
        filter = 'all';
      }
      currentFilter = filter;
      render();
    }

    /**
     * 添加待办：将输入框非空内容追加到 todos 并重新渲染，随后清空输入框。
     * 输入为空白（空或仅空格）时直接拦截，不新增。
     * @returns {void}
     */
    function addTodo() {
      const text = inputEl.value.trim();
      if (text === '') {
        return;
      }

      todos.push({ id: nextId++, text: text, completed: false });
      inputEl.value = '';
      render();
    }

    /**
     * 切换待办完成状态：根据 id 找到对应待办项并翻转 completed 字段。
     * @param {number} id 待办项 id
     * @returns {void}
     */
    function toggleTodo(id) {
      const todo = todos.find(function (t) {
        return t.id === id;
      });
      if (todo) {
        todo.completed = !todo.completed;
        render();
      }
    }

    /**
     * 删除待办：根据 id 从 todos 中移除对应待办项并重新渲染。
     * @param {number} id 待办项 id
     * @returns {void}
     */
    function removeTodo(id) {
      todos = todos.filter(function (t) {
        return t.id !== id;
      });
      render();
    }

    // Tab 点击切换筛选状态
    tabsEl.addEventListener('click', function (event) {
      const btn = event.target.closest('.tab');
      if (btn) {
        switchFilter(btn.dataset.filter);
      }
    });

    /**
     * 键盘切换 Tab：焦点位于 tab 按钮上时，ArrowRight/ArrowLeft 在 tab 间循环移动，
     * Home 跳到首个、End 跳到末个；切换后调用统一的 switchFilter() 并手动 focus 目标按钮。
     * 注意：键盘路径直接调 switchFilter() 而非派发 click，避免与 click 委托重复触发。
     * @returns {void}
     */
    tabsEl.addEventListener('keydown', function (event) {
      const tabBtns = Array.prototype.slice.call(tabsEl.querySelectorAll('.tab'));
      const currentIndex = tabBtns.findIndex(function (btn) {
        return btn.dataset.filter === currentFilter;
      });
      if (currentIndex === -1) {
        return;
      }

      let targetIndex = -1;
      switch (event.key) {
        case 'ArrowRight':
          targetIndex = (currentIndex + 1) % tabBtns.length;
          break;
        case 'ArrowLeft':
          targetIndex = (currentIndex - 1 + tabBtns.length) % tabBtns.length;
          break;
        case 'Home':
          targetIndex = 0;
          break;
        case 'End':
          targetIndex = tabBtns.length - 1;
          break;
        default:
          return;
      }

      event.preventDefault();
      const targetBtn = tabBtns[targetIndex];
      switchFilter(targetBtn.dataset.filter);
      targetBtn.focus();
    });

    // 点击「添加」按钮触发添加
    addBtnEl.addEventListener('click', addTodo);

    // 输入框回车触发添加
    inputEl.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        addTodo();
      }
    });

    // 初始渲染（空列表）
    render();
  </script>
</body>
</html>
